name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  
jobs:
  eslint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client #points to the frontend folder
    steps:
      - uses: actions/checkout@v4

      # JavaScript / TypeScript (ESLint)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint

name: Build Docker Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'server/**'
      - 'client/**'
      - 'infra/**'
      - 'scripts/**'
      - 'e2e/**'
      - '.github/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'server/**'
      - 'client/**'
      - 'infra/**'
      - 'scripts/**'
      - 'e2e/**'
      - '.github/**'

permissions:
  contents: read
  packages: write
  id-token: write 

env:
  AWS_REGION: ap-southeast-2
  ECR_REGISTRY: 960607644670.dkr.ecr.ap-southeast-2.amazonaws.com

jobs:
  # Unit + integration tests against a real PostgreSQL. Images are only built if these pass.
  test:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: myapp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d myapp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:test_password@localhost:5432/myapp
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma contract emit
      - run: npx prisma db migrate
      - name: Run tests with coverage (fails under 80%)
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "### API test coverage" >> "$GITHUB_STEP_SUMMARY"
            node -e "const t=require('./coverage/coverage-summary.json').total; for (const k of ['lines','statements','functions','branches']) console.log('- '+k+': '+t[k].pct+'%')" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage-${{ github.sha }}
          path: server/coverage
          retention-days: 30

  build:
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: api
            context: ./server
          - name: web
            context: ./client

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      
      - name: Lowercase repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"


      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::960607644670:role/github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}  

      - name: Log in to Amazon ECR
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/app/${{ matrix.name }}:latest
            ${{ env.ECR_REGISTRY }}/app/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

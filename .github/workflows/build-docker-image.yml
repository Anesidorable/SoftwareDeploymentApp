name: Build Docker Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'server/**'
      - 'client/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'server/**'
      - 'client/**'

permissions:
  contents: read
  packages: write
  id-token: write 

env:
  AWS_REGION: ap-southeast-2
  ECR_REGISTRY: 960607644670.dkr.ecr.ap-southeast-2.amazonaws.com

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: api
            context: ./server
          - name: web
            context: ./client

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      
      - name: Lowercase repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"


      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::960607644670:role/github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}  

      - name: Log in to Amazon ECR
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/app/${{ matrix.name }}:latest
            ${{ env.ECR_REGISTRY }}/app/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

services:
  api:
    build: ./server
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      TRUST_PROXY: "1"
      APP_ENV: local
    expose: ["5000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build: ./client
    environment:
      API_UPSTREAM: api:5000
    ports: ["8080:8080"]
    depends_on:
      api: { condition: service_healthy }
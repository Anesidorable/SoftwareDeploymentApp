# In order for this to work with your AWS account, you'll need an IAM user
# with the following permissions: AmazonEC2FullAccess, AmazonSSMReadOnlyAccess, 
# AWSCloudFormationFullAccess, IAMFullAccess

#  You'll also need to get permission to download the images from the ECR, leave your AWS
# account ID in discord and i'll setup a policy to allow your account to download the images.


Parameters:
  InstanceType:
    Type: String
    Default: t3.small
  RootVolumeSize:
    Type: Number
    Default: 20
    Description: Root EBS volume size in GiB
  WebContainerPort:
    Type: Number
    Default: 8080
  ApiContainerPort:
    Type: Number
    Default: 5000
  ImageTag:
    Type: String
    Default: latest
    Description: Image tag pulled on first boot
  Registry:
    Type: String
    Default: 960607644670.dkr.ecr.ap-southeast-2.amazonaws.com
  AlertEmail:
    Type: String
    Default: 104809887@student.swin.edu.au
    Description: Email address that receives CloudWatch alarm notifications

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole
 
  Ec2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP and HTTPS access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  Ec2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds:
        - !GetAtt Ec2SecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
 
          dnf update -y
          dnf install -y docker
          systemctl enable --now docker
 
          mkdir -p /opt/app
          cat > /opt/app/deploy.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          TAG=$1
          aws ecr get-login-password --region ${AWS::Region} \
            | docker login --username AWS --password-stdin ${Registry}
 
          docker pull ${Registry}/app/api:$TAG
          docker pull ${Registry}/app/web:$TAG
 
          docker network create appnetwork 2>/dev/null || true
          docker rm -f api web 2>/dev/null || true
 
          docker run -d --name api --network appnetwork --restart unless-stopped \
            -p 5000:${ApiContainerPort} ${Registry}/app/api:$TAG
          docker run -d --name web --network appnetwork --restart unless-stopped \
            -p 80:${WebContainerPort} ${Registry}/app/web:$TAG
 
          docker image prune -f
          SCRIPT
          chmod +x /opt/app/deploy.sh
 
          /opt/app/deploy.sh ${ImageTag}

  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref Ec2Instance

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CPU above 80% for 5 minutes
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !Ref Ec2Instance
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  HighMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Memory above 85% for 5 minutes
      Namespace: CWAgent
      MetricName: mem_used_percent
      Dimensions:
        - Name: InstanceId
          Value: !Ref Ec2Instance
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  DiskUsageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Root disk above 80% used
      Namespace: CWAgent
      MetricName: disk_used_percent
      Dimensions:
        - Name: InstanceId
          Value: !Ref Ec2Instance
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  HealthCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: /api/health failed twice in a row
      Namespace: GroceryApp
      MetricName: HealthCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref Ec2Instance
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]

  ContainerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /grocery/production/containers
      RetentionInDays: 14

  ServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Five or more HTTP 5xx responses within five minutes
      Namespace: GroceryApp
      MetricName: Http5xxCount
      Dimensions:
        - Name: InstanceId
          Value: !Ref Ec2Instance
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  SlowResponsesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: 95th-percentile response time above 500 ms for five minutes
      Namespace: GroceryApp
      MetricName: RequestLatencyP95Ms
      Dimensions:
        - Name: InstanceId
          Value: !Ref Ec2Instance
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 500
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: grocery-production
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"CPU utilisation (%)","region":"${AWS::Region}","stat":"Average","period":60,"metrics":[["AWS/EC2","CPUUtilization","InstanceId","${Ec2Instance}"]]}},
            {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Memory and disk used (%)","region":"${AWS::Region}","stat":"Average","period":60,"metrics":[["CWAgent","mem_used_percent","InstanceId","${Ec2Instance}"],["CWAgent","disk_used_percent","InstanceId","${Ec2Instance}"]]}},
            {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Network traffic (bytes)","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["AWS/EC2","NetworkIn","InstanceId","${Ec2Instance}"],["AWS/EC2","NetworkOut","InstanceId","${Ec2Instance}"]]}},
            {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"Disk I/O (bytes)","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["CWAgent","diskio_read_bytes","InstanceId","${Ec2Instance}"],["CWAgent","diskio_write_bytes","InstanceId","${Ec2Instance}"]]}},
            {"type":"metric","x":0,"y":12,"width":12,"height":6,"properties":{"title":"HTTP response time (ms)","region":"${AWS::Region}","stat":"Maximum","period":60,"metrics":[["GroceryApp","RequestLatencyP95Ms","InstanceId","${Ec2Instance}",{"label":"p95 of all requests"}],["GroceryApp","HealthLatencyMs","InstanceId","${Ec2Instance}",{"label":"/api/health"}]]}},
            {"type":"metric","x":12,"y":12,"width":12,"height":6,"properties":{"title":"HTTP 5xx errors and failed health checks","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["GroceryApp","Http5xxCount","InstanceId","${Ec2Instance}"],["GroceryApp","HealthCheckFailed","InstanceId","${Ec2Instance}"]]}},
            {"type":"alarm","x":0,"y":18,"width":24,"height":3,"properties":{"title":"Alarm status","alarms":["${HighCpuAlarm.Arn}","${HighMemoryAlarm.Arn}","${DiskUsageAlarm.Arn}","${ServerErrorsAlarm.Arn}","${SlowResponsesAlarm.Arn}","${HealthCheckAlarm.Arn}"]}}
          ]
        }

Outputs:
  InstanceId:
    Value: !Ref Ec2Instance
  PublicIp:
    Value: !Ref ElasticIP
  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=grocery-production
